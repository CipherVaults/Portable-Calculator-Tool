name: CI (dev)

# CI on dev (plan B14; M0 skeleton plus the M1 random diff and browser
# boot proof). There is deliberately NO release job yet: it
# arrives in M10, and main's first commit has no workflows at all, so a
# push to main can never publish anything by accident.
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-checks:
    name: Rust checks (fmt, clippy native + wasm32, tests, goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The Tauri app needs WebKitGTK on Linux; it is linted, tested and
      # smoke-tested in the windows-build job instead.
      - name: Clippy (native, every crate except the desktop app)
        run: cargo clippy --workspace --exclude portable-calculator-tool --all-targets --locked -- -D warnings
      - name: Clippy (wasm32, the engines, pcalc-api and pcalc-wasm)
        run: cargo clippy -p pcalc-api -p pcalc-wasm -p date-core -p percent-core -p calc-num -p calc-core -p units-core -p graph-core --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Tests (every crate except the desktop app)
        run: cargo test --workspace --exclude portable-calculator-tool --locked
      - name: date-core golden.json is up to date
        run: cargo run -p date-core --example gen_golden --locked -- --check
      - name: percent-core golden parity (v1.1 JavaScript oracle)
        run: cargo test -p percent-core --test golden_parity --locked
      - name: Unsafe code only where allowed
        run: node scripts/check-unsafe.mjs
      - name: App version is the same everywhere
        run: node scripts/check-versions.mjs

  web-build:
    name: Web build (engine.wasm x2, size budget, native/WASM parity and random diff)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build engine.wasm twice from clean and compare SHA-256
        run: node scripts/build-wasm.mjs --check-twice
      - name: Build the web app twice and compare every output byte (budgets enforced by the build)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-web.mjs
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/web-1.sha256"
          node scripts/build-web.mjs
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/web-2.sha256"
          diff "$RUNNER_TEMP/web-1.sha256" "$RUNNER_TEMP/web-2.sha256"
          cat "$RUNNER_TEMP/web-1.sha256"
      - name: Build the native bridges
        run: cargo build --release --locked -p pcalc-api -p date-core -p percent-core --examples
      # Every golden case plus 200,000 seeded random requests (the seed is
      # printed), native api_bridge vs engine.wasm byte for byte.
      - name: Native vs WASM parity, goldens and 200k random requests (TZ UTC, New York, Cairo)
        run: node scripts/check-wasm.mjs
      - name: App version is the same everywhere (including the built pages)
        run: node scripts/check-versions.mjs
      - name: safety-eval slice D (static hygiene with mutant proofs, built output)
        run: node scripts/safety-eval.mjs --json "$RUNNER_TEMP/safety-eval.json"
      - name: Upload the web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error

  windows-build:
    name: Windows build, browser boot (Edge) and desktop smoke test
    needs: web-build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # The exact web-build artifact (built on Linux) booted in headless Edge
      # under its real CSPs: served multi-file site and file:// single file,
      # tampered, blocked and no-WebAssembly engines with the rescue view.
      # It lives outside dist/, which the desktop build below cleans.
      - name: Download the web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: target/web-dist
      - name: Browser boot proof (headless Microsoft Edge over CDP)
        run: node scripts/browser-boot.mjs --dist target/web-dist --json "$env:RUNNER_TEMP/browser-boot.json"
      - name: Build the desktop front end (dist/desktop)
        run: node scripts/build-web.mjs --desktop-only
      - name: Clippy (desktop app)
        run: cargo clippy -p portable-calculator-tool --all-targets --locked -- -D warnings
      - name: Tests (desktop app)
        run: cargo test -p portable-calculator-tool --locked
      # `tauri build` (installers) arrives with the release work in M10.
      - name: Build the release binary
        run: cargo build -p portable-calculator-tool --release --locked
      # The release exe is a GUI-subsystem binary: invoked bare, PowerShell
      # neither waits for it nor sees its exit code, so the step would pass
      # even on a failed smoke run. Start-Process -Wait -PassThru gates on the
      # exit code, and the redirected stdout must carry SMOKE_TEST_OK.
      - name: Run real Tauri window smoke test
        shell: pwsh
        timeout-minutes: 5
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke-stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "smoke-stderr.txt"
          $p = Start-Process -FilePath .\target\release\portable-calculator-tool.exe -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed with exit code $($p.ExitCode)."
            exit 1
          }
          if (-not (Select-String -Path $out -SimpleMatch 'SMOKE_TEST_OK' -Quiet)) {
            Write-Error "Smoke test exited 0 but did not print SMOKE_TEST_OK."
            exit 1
          }
          "Smoke test exit code: $($p.ExitCode)"
